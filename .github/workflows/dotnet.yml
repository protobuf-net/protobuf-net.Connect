name: .NET

on:
  push:
    branches: [ "main" ]
  # deliberately NOT filtered by branch: the filter matches the PR's BASE, so any PR targeting a
  # branch missing from the list gets zero checks - and a PR with no checks looks clean rather than
  # broken, which is the wrong failure mode. The push filter above stays, since that one genuinely
  # stops each topic-branch push burning a runner.
  pull_request:

jobs:
  # Everything here is net8.0, so unlike the protobuf-net repository - whose traversal includes
  # net4x-only projects and therefore has to be Windows - the main leg can be Linux, which is also
  # where the native-AOT toolchain and the conformance runner live. One job instead of two.
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0  # full history, for Nerdbank.GitVersioning
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    # Restore dominates cold-runner time and the package set changes rarely
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-
    # ILC shells out to the platform toolchain to link; clang is on the image, zlib is not always
    - name: Install the native toolchain
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Report the computed version
      shell: bash
      run: |
        set -euo pipefail
        dotnet tool restore
        version=$(dotnet tool run nbgv -- get-version --variable NuGetPackageVersion | tr -d '[:space:]')
        assembly=$(dotnet tool run nbgv -- get-version --variable AssemblyInformationalVersion | tr -d '[:space:]')
        echo "computed version : $version"
        echo "release tag      : $version"
        {
          echo "### Version"
          echo ""
          echo "| | |"
          echo "| --- | --- |"
          echo "| computed version | \`$version\` |"
          echo "| **release tag** | \`$version\` |"
          echo "| informational | \`$assembly\` |"
          echo ""
          echo "Releases → Draft a new release → tag \`$version\` → publish."
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Restore dependencies
      run: dotnet restore Build.csproj
    - name: Build
      run: dotnet build Build.csproj --no-restore
    # No `dotnet test` step, deliberately: nothing here is a unit-test project, so it finds nothing
    # and exits 1. The checks below ARE the test suite - executables that return an exit code, run
    # against external oracles rather than against our own opinion. See AGENTS.md.
    - name: Contract-first checks
      run: dotnet run --project tests/ConnectContractFirst/ConnectContractFirst.csproj --no-build

    # The code-first JSON mapping, against Google's own JsonFormatter over protoc's C# for the same
    # schema. An EXTERNAL oracle, which is the whole point: a JSON writer and reader of ours would
    # round-trip perfectly against each other while spelling every key differently from everyone
    # else. The .proto is re-derived from the contracts on every run, so it cannot quietly stop
    # describing the types it is supposed to describe.
    - name: Code-first JSON differential
      run: dotnet run --project tests/ConnectJsonDifferential/ConnectJsonDifferential.csproj

    # self-contained: hosts Kestrel on an ephemeral loopback port and calls itself, so it needs
    # nothing from the network. tests/ConnectProbe is deliberately NOT here - it checks interoperability
    # against demo.connectrpc.com, and a third party's uptime has no business gating our builds.
    - name: Publish and run the Connect smoke test
      run: |
        dotnet publish tests/AotConnectSmoke/AotConnectSmoke.csproj -c Release -r linux-x64 -o artifacts/aot-connect-smoke
        ./artifacts/aot-connect-smoke/AotConnectSmoke
    - name: Publish and run the code-first JSON AOT smoke test
      run: |
        dotnet publish tests/AotConnectJsonSmoke/AotConnectJsonSmoke.csproj -c Release -r linux-x64 -o artifacts/aot-json-smoke
        ./artifacts/aot-json-smoke/AotConnectJsonSmoke
    # One contract, one implementation, one host, served over gRPC and Connect at the same time and
    # called both ways - the claim the whole library rests on, and the only check that exercises it.
    - name: Publish and run the dual-transport smoke test
      run: |
        dotnet publish tests/AotDualHostSmoke/AotDualHostSmoke.csproj -c Release -r linux-x64 -o artifacts/aot-dual-host
        ./artifacts/aot-dual-host/AotDualHostSmoke

    # The only EXTERNAL oracle for the protocol itself: connectrpc/conformance drives a real Connect
    # client against our server, and our client against its reference server, and checks the wire
    # rather than our opinion of it. Worth gating because of what it catches - every defect it has
    # found was a place where both of our own ends agreed with each other and neither agreed with the
    # protocol, which no self-test can find by construction.
    #
    # A pinned release artefact with its checksum verified, not a live service.
    - name: Run the Connect conformance suite
      run: |
        set -euo pipefail
        VERSION=1.0.5
        SHA=7d4d1f36980debf900b12514c8d51107245e9195b3c581e61fa165fd95c94284
        curl -sSL --retry 3 -o conformance.tar.gz \
          "https://github.com/connectrpc/conformance/releases/download/v$VERSION/connectconformance-v$VERSION-Linux-x86_64.tar.gz"
        echo "$SHA  conformance.tar.gz" | sha256sum -c -
        tar xzf conformance.tar.gz connectconformance
        dotnet publish tests/ConnectConformance/ConnectConformance.csproj -c Release -o artifacts/conformance
        CONF=tests/ConnectConformance/conformance-config.yaml
        ./connectconformance --mode server --conf $CONF -- ./artifacts/conformance/ConnectConformance
        ./connectconformance --mode client --conf $CONF -- ./artifacts/conformance/ConnectConformance --client

    # Packaging validation runs at pack time, so without a pack here it would run only at release -
    # after the change had been merged and tagged, which is far too late to stop anything. Packing=true
    # narrows the traversal to the three shipping projects, so this is a small build rather than a
    # second full one.
    - name: Pack
      run: |
        dotnet build Build.csproj -c Release -p:Packing=true -p:GeneratePackageOnBuild=false
        dotnet pack Build.csproj --no-build -c Release -p:Packing=true -p:PackageOutputPath=${{ github.workspace }}/.nupkgs
    # Attaches the .nupkg files to the run so a packaging problem can be inspected from the Actions
    # page. Nothing here publishes: CI has no `nuget push` step and, more to the point, no
    # `id-token: write` - so the OIDC exchange with nuget.org is not available to it at all. Only
    # release.yml can publish, and only on a published GitHub Release.
    - name: Attach packages to this run (artifact, not a feed)
      uses: actions/upload-artifact@v4
      with:
        name: nupkgs
        path: .nupkgs/*.nupkg

    # benchmarks/ConnectLoad and benchmarks/ConnectBenchmark are deliberately absent: benchmarks are slow and
    # machine-sensitive, and these are measurements to re-take rather than thresholds to gate on.
